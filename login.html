<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 湖南省中小学人工智能通识教育平台</title>
<link rel="stylesheet" href="css/style.css?v=77">
</head>
<body>
<div class="login-page">
  <div class="login-shell">

    <!-- 品牌展示区 -->
    <aside class="login-brand">
      <div class="logo-mark on-dark login-brand-logo">
        <img class="logo-icon" src="assets/logo.svg?v=5" alt="平台标识">
        <div class="logo-text">
          <span class="name">湖南省中小学人工智能通识教育平台</span>
        </div>
      </div>

      <div class="brand-illustration">
        <img src="assets/img/login-ai-education-illustration.png" alt="人工智能课堂插画">
      </div>

      <div class="brand-copy">
        <h2>人工智能通识教育<br>从这里走进每一间教室</h2>
      </div>
    </aside>

    <!-- 表单区 -->
    <main class="login-form-wrap">
      <div class="top-logo">
        <div class="logo-mark">
          <img class="logo-icon" src="assets/logo.svg?v=5" alt="平台标识">
          <div class="logo-text">
            <span class="name">湖南省中小学人工智能通识教育平台</span>
          </div>
        </div>
      </div>

      <div class="login-tabs" role="tablist">
        <button class="tab active" data-tab="code" role="tab">验证码登录</button>
        <button class="tab" data-tab="pwd" role="tab">密码登录</button>
      </div>

      <!-- 验证码登录 -->
      <form class="form-panel active" id="panel-code" novalidate>
        <div class="field">
          <label for="phone-input">手机号</label>
          <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <input type="tel" id="phone-input" maxlength="11" placeholder="请输入手机号" autocomplete="tel" value="13800138000">
          </div>
        </div>
        <div class="field">
          <label for="code-input">验证码</label>
          <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="text" id="code-input" maxlength="6" placeholder="请输入6位验证码" autocomplete="one-time-code" value="123456">
            <button type="button" class="code-btn" id="code-btn">获取验证码</button>
          </div>
        </div>
        <label class="agreement">
          <input type="checkbox" id="code-agreement" checked>
          <span>已阅读并同意 <a href="#">《用户协议》</a> 与 <a href="#">《隐私政策》</a>，首次登录将自动创建账号</span>
        </label>
        <button type="submit" class="primary-btn">登录 / 注册</button>
        <p class="form-hint">无需注册 · 验证手机号后即可使用</p>
      </form>

      <!-- 密码登录 -->
      <form class="form-panel" id="panel-pwd" novalidate>
        <div class="field">
          <label for="acc-input">账号</label>
          <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
            <input type="text" id="acc-input" placeholder="账号 / 手机号" autocomplete="username" value="13800138000">
          </div>
        </div>
        <div class="field">
          <label for="pwd-input">密码</label>
          <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="pwd-input" placeholder="请输入密码" autocomplete="current-password" value="123456">
          </div>
        </div>
        <div class="form-aux">
          <label class="agreement">
            <input type="checkbox" id="pwd-agreement" checked>
            <span>已阅读并同意 <a href="#">《用户协议》</a> 与 <a href="#">《隐私政策》</a></span>
          </label>
          <button type="button" class="text-link" id="to-reset">忘记密码？</button>
        </div>
        <button type="submit" class="primary-btn">登 录</button>
        <p class="form-hint">演示账号已自动填写，直接点击登录即可</p>
      </form>

      <!-- 忘记密码 / 重置密码 -->
      <form class="form-panel" id="panel-reset" novalidate>
        <div class="reset-head">
          <button type="button" class="back-link" id="back-login">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><polyline points="15 18 9 12 15 6"/></svg>
            返回登录
          </button>
        </div>
        <div class="field">
          <label for="reset-phone">手机号</label>
          <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
            <input type="tel" id="reset-phone" maxlength="11" placeholder="请输入注册手机号" autocomplete="tel">
          </div>
        </div>
        <div class="field">
          <label for="reset-code">验证码</label>
          <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="text" id="reset-code" maxlength="6" placeholder="请输入6位验证码" autocomplete="one-time-code">
            <button type="button" class="code-btn" id="reset-code-btn">获取验证码</button>
          </div>
        </div>
        <div class="field">
          <label for="reset-pwd">新密码</label>
          <div class="input-group">
            <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="11" width="18" height="10" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            <input type="password" id="reset-pwd" placeholder="请设置6-20位新密码" autocomplete="new-password">
          </div>
        </div>
        <button type="submit" class="primary-btn">重置密码</button>
        <p class="form-hint">重置成功后将自动返回密码登录</p>
      </form>

    </main>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="js/login.js?v=4"></script>
</body>
</html>
